# Project metadata, dependencies, and every linter/type-checker/test-runner
# config live here, in one file.
[project]
name = "craftainer-crud"
# Single source of the version. Stays 0.0.0 in git: release.yml's tag is the
# real version, stamped into the build at release time without a commit.
version = "0.0.0"
description = "Generic CRUD framework for FastAPI: router factories, repositories, model and view bases"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1,<1",
    "pydantic>=2.13.5,<3",
    # request.form() in the web form routes.
    "python-multipart>=0.0.32,<1",
    # Capped below 2.1: the repository is type-checked (mypy --strict) against 2.0's
    # Select/Row typing, which 2.1 changes; widen once it is verified on 2.1.
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
]

[project.optional-dependencies]
# Imported lazily, only inside the MQTT sink/source and the XML codec.
# paho-mqtt is imported directly (MQTT 5.0 properties), so it is declared, with the same
# range aiomqtt 2.x itself requires.
mqtt = ["aiomqtt>=2.5.1,<3", "paho-mqtt>=2.1.0,<3"]
xml = ["defusedxml>=0.7.1,<1"]

[dependency-groups]
# Installed by a plain `uv sync` (uv's default group).
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-benchmark==5.3.0",
    "pytest-codspeed==5.0.3",
    "import-linter==2.15",
    "pip-audit==2.10.1",
    "pytest-asyncio==1.4.0",
    "httpx2==2.13.0",
    "asyncpg==0.31.0",
    # The extras, so the unit tests exercise the optional code paths.
    "aiomqtt==2.5.1",
    "paho-mqtt==2.1.0",
    "defusedxml==0.7.1",
    "types-defusedxml==0.7.0.20260504",
    # Validates the CRUD manifest conformance fixtures against schemas/crud-manifest/v1.json.
    "jsonschema==4.26.0",
    "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/craftainer_crud"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Kept outside the bind-mounted /workspace: a cache dir inside the mount gets
# scanned file-by-file by host antivirus tools on Windows and is slow to write.
cache-dir = "/home/vscode/.cache/ruff"

[tool.ruff.lint]
# Curated strict set: correctness + style + security (S) + pylint (PL) +
# mandatory type annotations (ANN) + docstrings on public members (D1xx).
# COM812/ISC001 conflict with the ruff formatter (ruff's own recommendation).
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "N", "S", "A", "SIM", "RUF", "PL", "ANN",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["craftainer_crud"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; comparing to literal values is not a magic number.
"tests/**" = ["S101", "PLR2004"]
# Fake Repository fixtures mirror the real Repository protocol's
# include_archived/include_unpublished-bearing get/list/count signatures (see the
# src/craftainer_crud/repositories/*.py per-file-ignores below for the same reasoning).
"tests/unit/controllers/test_crud_router.py" = ["S101", "PLR2004", "PLR0913"]
"tests/unit/interfaces/test_base.py" = ["S101", "PLR2004", "PLR0913"]
# crud_router.py's factories take one named parameter per route-building option
# (prefix/roles/schemas/etc, PLR0913) and pass FastAPI Depends(...)/role objects
# through untyped (ANN401) -- both are inherent to genericizing route wiring
# itself, not accidental complexity; see the module docstring. build_xml_router
# (PLR0915) is one long, linear "one `if opt_in_param: @router.get/post(...)`
# block per record-lifecycle route" sequence, mirroring build_json_router's own
# shape one-for-one -- splitting it up would hide that direct correspondence,
# which is the point (see "Generic CRUD router factories" in
# controllers/README.md).
"src/craftainer_crud/controllers/crud_router.py" = ["ANN401", "PLR0913", "PLR0915", "PLR0917"]
# crud_manifest_router's keyword-only signature is the public API the template and SDK
# mirror (registry, service name/version, stats TTL, OIDC URL, prefix) -- one named
# parameter per piece of host input, none of which can be derived by the library.
"src/craftainer_crud/controllers/crud_manifest.py" = ["PLR0913"]
# render_crud_component_js takes one named parameter per opt-in UI capability
# it renders (archivable/draftable/has_revisions/has_events/stats_enabled),
# mirroring crud_router.py's build_json_router's own opt-in param shape --
# inherent to keeping this generic across every resource, not accidental
# complexity.
"src/craftainer_crud/web_components.py" = ["PLR0913"]
# crud_actions.py's resolve_* helpers take one named parameter per piece of
# per-route context (crud/schema/request/id/not_found/etc, PLR0913) and return
# a schema instance or a bulk-result view depending on the id/filter branch
# taken (ANN401) -- same generic-wiring justification as crud_router.py above;
# see the module docstring.
"src/craftainer_crud/controllers/crud_actions.py" = ["ANN401", "PLR0913"]
# Repository.get/list/count and CRUDInterface.get/list/count/CompatCRUD.get/list/
# count all take include_archived/include_unpublished alongside their existing
# filters/sort/skip/limit parameters (see craftainer_crud.models.mixins) -- one named kwarg
# per lifecycle flag, inherent to keeping every generic query method aware of
# both, not accidental complexity.
"src/craftainer_crud/repositories/base.py" = ["PLR0913"]
"src/craftainer_crud/repositories/memory.py" = ["PLR0913"]
"src/craftainer_crud/repositories/sqlalchemy.py" = ["PLR0913"]
"src/craftainer_crud/interfaces/base.py" = ["PLR0913"]
"src/craftainer_crud/interfaces/compat.py" = ["PLR0913"]

[tool.importlinter]
# Within the package, a layer may import a layer listed after it, never one
# listed before it (models must never import from controllers). Run via
# `uv run lint-imports` (wired into .pre-commit-config.yaml).
root_packages = ["craftainer_crud"]
# Needed for the forbidden-import contract below: `app` is not part of this package.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "crud layers"
type = "layers"
containers = ["craftainer_crud"]
layers = [
    "controllers",
    "interfaces",
    "repositories",
    "views",
    "models",
]

# The package is host-agnostic: the host passes settings and sessions in through
# config.configure(...), never the other way round.
[[tool.importlinter.contracts]]
name = "crud never imports app"
type = "forbidden"
source_modules = ["craftainer_crud"]
forbidden_modules = ["app"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
warn_unreachable = true
cache_dir = "/home/vscode/.cache/mypy"

[tool.pytest.ini_options]
cache_dir = "/home/vscode/.cache/pytest"
# tests/bench is run explicitly: `uv run pytest tests/bench --no-cov`.
addopts = "--strict-markers --strict-config -ra --ignore=tests/bench --cov=craftainer_crud --cov-report=term-missing"
# tests/integration needs the compose Postgres (POSTGRES_* env vars) and is part of the
# coverage gate: the SQLAlchemy repository is exercised only against a real database.
testpaths = ["tests/unit", "tests/integration"]
# Lets an `async def test_...` run without a per-test @pytest.mark.asyncio marker.
asyncio_mode = "auto"
# One session-scoped loop: the integration tests share a process-wide asyncpg
# engine, and asyncpg rejects connections handed from one loop to another.
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["craftainer_crud"]
branch = true
relative_files = true
data_file = "/home/vscode/.cache/coverage/.coverage"

[tool.coverage.report]
fail_under = 100
show_missing = true
