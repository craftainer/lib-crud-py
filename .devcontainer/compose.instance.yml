# tool-crud's instance-owned additions to template-base's compose.yml (whose
# dev service is `myapp`): the Postgres the integration tests run against.
# Defined inline rather than as a stack/ fragment since it is the only service.
# Credentials are local-dev throwaways on the compose network (no ports are
# published), so they live here as literals.
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crud
      POSTGRES_PASSWORD: crud
      POSTGRES_DB: tool_crud_test
    # 18+'s image keeps data in a major-version subdirectory of this mount, so
    # the volume mounts one level up (docker-library/postgres#1259).
    volumes:
      - postgres-data:/var/lib/postgresql
    # $$: a literal $ for the container's shell, which reads the variables above.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  myapp:
    # Waits for the healthcheck so postCreateCommand and prek never start
    # before the database they would talk to is ready.
    depends_on:
      postgres:
        condition: service_healthy
    # Read by tests/integration/db.py; without them those tests skip.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: crud
      POSTGRES_PASSWORD: crud
      POSTGRES_DB: tool_crud_test

volumes:
  postgres-data:
